<script>


/* ==========================
   PREZISCORE MATCH FINAL
========================== */



function getLocalDate(){


let d = new Date();


return d.getFullYear()
+ "-"
+ String(d.getMonth()+1).padStart(2,"0")
+ "-"
+ String(d.getDate()).padStart(2,"0");


}




async function startMatches(){


let today = getLocalDate();


await displayTodayMatches(today);


}



startMatches();





/* Refresh chak 60 segonn */


setInterval(()=>{


let today = getLocalDate();


displayTodayMatches(today);


},60000);





/* ==========================
   SEARCH MATCH
========================== */


const search =
document.getElementById("match-search");



if(search){


search.addEventListener(
"keyup",
()=>{


let value =
search.value.toLowerCase();



document
.querySelectorAll(
"#today-container .match-card"
)
.forEach(card=>{


let text =
card.innerText.toLowerCase();



if(text.includes(value)){


card.style.display="block";


}else{


card.style.display="none";


}


});


});


}





</script>
