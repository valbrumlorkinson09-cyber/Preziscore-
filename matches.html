<script>


/* ==========================
   PREZISCORE MATCH START
========================== */


async function startMatches(){


    let today = new Date()

    .toISOString()

    .split("T")[0];



    await displayTodayMatches(today);



}



startMatches();




/* Rafrechi chak 1 minit */


setInterval(()=>{


    let today = new Date()

    .toISOString()

    .split("T")[0];



    displayTodayMatches(today);


},60000);



</script>


<section class="search">


<input 
type="text" 
id="match-search"
placeholder="🔍 Chèche yon ekip oswa lig..."
>


</section>





<script>


/* ==========================
   PREZISCORE MATCH SEARCH
========================== */


const searchInput =
document.getElementById("match-search");



if(searchInput){


searchInput.addEventListener(
"keyup",
()=>{


let value =
searchInput.value.toLowerCase();



const cards =
document.querySelectorAll(
"#today-container .match-card"
);



cards.forEach(card=>{


let text =
card.innerText.toLowerCase();



if(text.includes(value)){


card.style.display="block";


}else{


card.style.display="none";


}


});


});


}





/* ==========================
   MATCH ANIMATION
========================== */


document.addEventListener(
"DOMContentLoaded",
()=>{


const cards =
document.querySelectorAll(
".match-card"
);



cards.forEach((card,index)=>{


card.style.animation =
"fadeIn 0.5s ease " + 
(index * 0.1) + "s";


});


});


</script>
